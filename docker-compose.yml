services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booth
      POSTGRES_PASSWORD: booth
      POSTGRES_DB: booth
    ports:
      - "5432:5432"
    volumes:
      - booth_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booth -d booth"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  booth_pg:
